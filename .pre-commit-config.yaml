repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version. Keep it the same as the ruff version in uv.lock.
    rev: v0.17.3
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format
  - repo: local
    hooks:
      # Check types with the mypy in .venv, which can see the project's
      # packages. mypy's own hook runs in a separate environment that can't.
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        # Check the whole project, as configured in pyproject.toml, not only
        # the files being committed; mypy's cache keeps this fast.
        pass_filenames: false
