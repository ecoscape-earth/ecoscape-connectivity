[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ecoscape-connectivity"
version = "0.2.5"
authors = [
  {name="Luca de Alfaro", email="luca@ucsc.edu"},
  {name="Coen Adler", email="ctadler@ucsc.edu"},
  {name="Artie Nazarov", email="anazarov@ucsc.edu"},
  {name="Natalia Ocampo-Peñuela", email="nocampop@ucsc.edu"},
  {name="Jasmine Tai", email="cjtai@ucsc.edu"},
  {name="Natalie Valett", email="nvalett@ucsc.edu"}
]
description = "EcoScape habitat connectivity computation."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=2.5.3",
    "scgt>=0.0.32",
    "torch>=2.14.1",
]

[dependency-groups]
dev = [
    "matplotlib==3.11.2",
    "mypy>=2.4.1",
    "notebook==7.6.3",
    "pre-commit>=4.7.0",
    "pydoc-markdown==4.8.2",
    "pytest==9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.uv]
# The GDAL Python package (required by scgt) is built from source against
# the system GDAL library, so its version must match the installed library
# (gdal-config --version). Remove once scgt no longer needs GDAL (#33).
constraint-dependencies = ["gdal==3.13.3"]

[tool.setuptools]
packages = ["ecoscape_connectivity"]

[tool.setuptools.package-data]
# Tells type checkers in projects that use EcoScape to use its annotations.
ecoscape_connectivity = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["ecoscape_connectivity"]
# The command-line wrapper has no tests.
omit = ["ecoscape_connectivity/main.py"]
# Required by python-coverage-comment-action, which reads .coverage in CI.
relative_files = true

[tool.coverage.report]
show_missing = true
# Starting coverage was 82%. Raise this as tests are added.
fail_under = 80

[tool.mypy]
files = ["ecoscape_connectivity", "tests"]
# Every function must have type annotations.
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# scgt and the GDAL bindings (osgeo) have no type information.
module = ["scgt", "scgt.*", "osgeo", "osgeo.*"]
ignore_missing_imports = true

[project.scripts]
ecoscape-connectivity = "ecoscape_connectivity.main:cli"

[project.urls]
"Homepage" = "https://github.com/ecoscape-earth/ecoscape-connectivity"
"Project Homepage" = "https://ecoscape-earth.github.io"
"Bug Tracker" = "https://github.com/ecoscape-earth/ecoscape-connectivity/issues"
