[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ecoscape-connectivity"
version = "0.2.5"
authors = [
  {name="Luca de Alfaro", email="luca@ucsc.edu"},
  {name="Coen Adler", email="ctadler@ucsc.edu"},
  {name="Artie Nazarov", email="anazarov@ucsc.edu"},
  {name="Natalia Ocampo-Peñuela", email="nocampop@ucsc.edu"},
  {name="Jasmine Tai", email="cjtai@ucsc.edu"},
  {name="Natalie Valett", email="nvalett@ucsc.edu"}
]
description = "EcoScape habitat connectivity computation."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=2.5.3",
    "rasterio>=1.5.2",
    "torch>=2.14.1",
    "typing-extensions>=4.16.0",
]

[dependency-groups]
dev = [
    "matplotlib==3.11.2",
    "mutmut>=3.8.1",
    "mypy>=2.4.1",
    "notebook==7.6.3",
    "pre-commit>=4.7.0",
    "pydoc-markdown==4.8.2",
    "pytest==9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.setuptools]
packages = ["ecoscape_connectivity"]

[tool.setuptools.package-data]
# Tells type checkers in projects that use EcoScape to use its annotations.
ecoscape_connectivity = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["ecoscape_connectivity"]
# The command-line wrapper has no tests.
omit = ["ecoscape_connectivity/main.py"]
# Required by python-coverage-comment-action, which reads .coverage in CI.
relative_files = true

[tool.coverage.report]
show_missing = true
# Just below the current total (96% in November 2026). Raise it as tests
# are added, so coverage can't quietly drop.
fail_under = 95

[tool.mypy]
files = ["ecoscape_connectivity", "scripts", "tests"]
# Every function must have type annotations.
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# rasterio has no type information.
module = ["rasterio", "rasterio.*"]
ignore_missing_imports = true

[tool.mutmut]
source_paths = ["ecoscape_connectivity"]
# The command-line wrapper has no tests, as in [tool.coverage.run].
do_not_mutate = ["ecoscape_connectivity/main.py"]
pytest_add_cli_args_test_selection = ["tests/"]
# mutmut runs the tests from a copy in mutants/, and the tests read the
# test data relative to their own location.
also_copy = ["assets/"]
# torch isn't safe to use in a process forked after it was imported.
process_isolation = "forkserver"
# Mutants that mypy rejects are reported as caught and not run.
type_check_command = [
    "mypy",
    "ecoscape_connectivity",
    "--output",
    "json",
    "--disable-error-code",
    "unused-ignore",
]
# Progress output, which tests don't check.
do_not_mutate_patterns = ['print\(']

[project.scripts]
ecoscape-connectivity = "ecoscape_connectivity.main:cli"

[project.urls]
"Homepage" = "https://github.com/ecoscape-earth/ecoscape-connectivity"
"Project Homepage" = "https://ecoscape-earth.github.io"
"Bug Tracker" = "https://github.com/ecoscape-earth/ecoscape-connectivity/issues"
